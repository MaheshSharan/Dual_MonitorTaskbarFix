name: checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: The tool runs and reports the current mode
        shell: pwsh
        run: |
          node npm\bin\dual-monitor-taskbar-fix.js --help
          node npm\bin\dual-monitor-taskbar-fix.js --status

      - name: Tool compiles
        run: node --check npm\bin\dual-monitor-taskbar-fix.js

      - name: Docs contain no em dashes
        shell: pwsh
        run: python experimental\scripts\emdash.py . --check

      - name: Docs links resolve
        shell: pwsh
        run: |
          $root = "."
          $broken = @()
          Get-ChildItem $root -Recurse -Include *.md -File |
            Where-Object { $_.FullName -notmatch "v1\\analysis|deep-research" } |
            ForEach-Object {
              $file = $_
              $text = Get-Content $file.FullName -Raw
              foreach ($m in [regex]::Matches($text, '\]\(([^)#]+)\)')) {
                $target = $m.Groups[1].Value
                if ($target -match '^(https?|mailto):') { continue }
                $base = Split-Path $file.FullName -Parent
                $resolved = Join-Path $base $target
                if (-not (Test-Path $resolved)) {
                  $broken += "$($file.FullName): $target"
                }
              }
            }
          if ($broken.Count -gt 0) {
            $broken | ForEach-Object { Write-Output "  broken: $_" }
            exit 1
          }
          Write-Output "all relative links resolve"

      - name: Docs name real paths
        shell: pwsh
        run: |
          # Every path a reader is told to run must exist.
          $required = @(
            "npm\bin\dual-monitor-taskbar-fix.js",
            "npm\package.json",
            "npm\README.md",
            "experimental\scripts\emdash.py",
            "experimental\scripts\taskbar_buttons.ps1",
            "experimental\scripts\set_taskbar_mode.ps1",
            "experimental\scripts\fetch_binaries.ps1",
            "experimental\README.md",
            "docs\analysis\07-correction.md",
            "LICENSE"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Output "  missing: $_" }
            exit 1
          }
          Write-Output "all referenced paths exist"
